[project]
name = "wearable-coach-mcp"
version = "0.1.0"
description = "MCP server that gives an AI training coach access to wearables (Garmin first) with code-enforced training limits."
requires-python = ">=3.11"
dependencies = [
    "garminconnect==0.3.19",
    "mcp[cli]>=1.20,<2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wearable-mcp = "wearable_mcp.server:main"
wearable-login = "wearable_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wearable_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
